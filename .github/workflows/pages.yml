name: Deploy POS_v1 to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build static preview
        run: |
          npm run build 2>&1 | tee build.log

          # Next.js server/API routes cannot run on GitHub Pages.
          # Create a minimal static landing page that clearly identifies
          # the repository as a server-backed POS and links to the source.
          rm -rf _site
          mkdir -p _site
          cat > _site/index.html <<'EOF'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1">
            <title>FreshMart POS — Version 1</title>
            <style>
              body{font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif;margin:0;background:#f6f7f9;color:#17191c}
              main{max-width:760px;margin:12vh auto;padding:32px}
              .card{background:#fff;border:1px solid #ddd;border-radius:16px;padding:32px;box-shadow:0 8px 30px #0000000b}
              h1{margin-top:0}
              p{line-height:1.6;color:#50555c}
              code{background:#f0f1f3;padding:2px 6px;border-radius:6px}
            </style>
          </head>
          <body><main><div class="card">
            <h1>FreshMart POS — Version 1</h1>
            <p>This repository contains a Next.js POS application with server-side API routes and a PostgreSQL/Drizzle backend.</p>
            <p>GitHub Pages can host the repository's static preview only; the live transactional backend requires a Next.js-capable server.</p>
            <p><a href="https://github.com/deebong/POS_v1">View source on GitHub</a></p>
          </div></main></body>
          </html>
          EOF

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
